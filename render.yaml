# Optional Render Blueprint: Django API service only.
# Dashboard: New -> Blueprint -> connect repo -> select this file if prompted.
# Or configure the existing Web Service manually using apps/backend/.env.example.

services:
  - type: web
    name: medfinder-api
    runtime: docker
    region: oregon
    plan: free
    # Monorepo: scope this service to the Django app, not the repo-root Node Dockerfile.
    rootDir: apps/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DEBUG
        value: "false"
      # Keep your existing production database URL, for example Supabase or Render Postgres.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
